---
name: "Reusable Python CI (2026 Gold Standard)"

on:
  workflow_call:
    inputs:
      python-versions:
        description: "JSON array of Python versions for matrix testing"
        required: false
        type: string
        default: '["3.11", "3.12", "3.13"]'
      run-tests:
        description: "Whether to run pytest suites"
        required: false
        type: boolean
        default: true
      fail-fast:
        description: "Fail entire matrix on first error"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            **/requirements*.txt

      - name: Provision Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Fast Static Analysis (Ruff Linter)
        run: uvx ruff check .

      - name: Fast Format Verification (Ruff Formatter)
        run: uvx ruff format --check .

      - name: Resolve & Install Dependencies
        run: |
          if [ -f "pyproject.toml" ]; then
            echo "Installing via pyproject.toml..."
            uv pip install --system -e ".[dev]" 2>/dev/null || uv pip install --system -e . 2>/dev/null || true
          elif [ -f "requirements.txt" ]; then
            echo "Installing via requirements.txt..."
            uv pip install --system -r requirements.txt 2>/dev/null || true
          fi

      - name: Execute Automated Tests (pytest)
        if: ${{ inputs.run-tests }}
        run: |
          if [ -d "tests" ] || [ -f "test.py" ] || [ -d "test" ]; then
            echo "==> Running pytest suite with coverage..."
            uv run pytest --cov --cov-report=term-missing --cov-report=xml 2>/dev/null || uv run pytest
          else
            echo "No test suite discovered, skipping pytest."
          fi
